<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conexão P2P - Supabase</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: Arial, sans-serif; 
      background: #0f0f1a; 
      color: white; 
      min-height: 100vh;
    }
    .container { 
      max-width: 1200px; 
      margin: 0 auto; 
      padding: 20px; 
    }
    .header { 
      text-align: center; 
      margin-bottom: 25px; 
      padding: 15px;
      background: #16213e;
      border-radius: 12px;
    }

    .room-box {
      background: #1a1a2e;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      text-align: center;
    }
    .room-box input {
      padding: 12px 15px;
      border-radius: 8px;
      border: none;
      width: 280px;
      font-size: 16px;
      margin-right: 10px;
      margin-bottom: 10px;
    }
    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
      transition: 0.2s;
    }
    .btn-primary { background: #00bfff; color: white; }
    .btn-primary:hover { background: #0099cc; }
    .btn-danger { background: #ff4444; color: white; }
    .btn-danger:hover { background: #cc0000; }
    #linkCompartilhar {
      margin-top: 12px;
      color: #00bfff;
      word-break: break-all;
      font-size: 14px;
      display: none;
      background: #16213e;
      padding: 10px;
      border-radius: 6px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin: 20px 0;
    }
    @media (max-width: 768px) {
      .video-grid { grid-template-columns: 1fr; }
    }
    .video-container {
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      min-height: 200px;
    }
    .video-container p {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.6);
      padding: 5px 10px;
      border-radius: 6px;
      z-index: 2;
    }
    video {
      width: 100%;
      height: auto;
      display: block;
      background: #222;
    }
    #localVideo { transform: scaleX(-1); }

    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 15px 0;
    }

    .chat-area {
      background: #1a1a2e;
      border-radius: 12px;
      height: 320px;
      overflow-y: auto;
      padding: 15px;
      margin: 15px 0;
    }
    .message {
      margin: 8px 0;
      padding: 10px 14px;
      border-radius: 8px;
      max-width: 80%;
      line-height: 1.4;
    }
    .me {
      background: #00bfff;
      margin-left: auto;
      text-align: right;
    }
    .them {
      background: #33334d;
      margin-right: auto;
    }
    .chat-input-area {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .chat-input-area input {
      flex: 1;
      padding: 12px 15px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    .status {
      text-align: center;
      padding: 12px;
      border-radius: 6px;
      margin: 10px 0;
      font-size: 16px;
      font-weight: bold;
    }
    .conectado { background: #2ecc71; }
    .desconectado { background: #e74c3c; }
    .conectando { background: #f39c12; }
    
    .log-area {
      background: #222;
      color: #0f0;
      font-family: monospace;
      font-size: 12px;
      padding: 10px;
      border-radius: 8px;
      height: 100px;
      overflow-y: auto;
      margin: 10px 0;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔗 Conexão P2P - Supabase</h1>
      <p>Áudio • Vídeo • Texto | Servidor Próprio e Estável</p>
    </div>

    <div class="room-box">
      <h2>Entrar ou Criar Sala</h2>
      <input type="text" id="roomCode" placeholder="Código da Sala">
      <br>
      <button onclick="criarSala()" class="btn-primary">➕ Gerar Código</button>
      <button onclick="entrarSala()" class="btn-primary">🚪 Entrar</button>
      <div id="linkCompartilhar">🔗 Link para enviar: <span id="linkTexto"></span></div>
    </div>

    <div id="statusConexao" class="status desconectado">Aguardando código...</div>

    <div class="log-area" id="logTela">LOG DE SISTEMA:<br></div>

    <div class="video-grid">
      <div class="video-container">
        <p>Você</p>
        <video id="localVideo" autoplay playsinline muted></video>
      </div>
      <div class="video-container">
        <p>Parceiro</p>
        <video id="remoteVideo" autoplay playsinline></video>
      </div>
    </div>

    <div class="controls">
      <button id="btnAudio" onclick="alternarAudio()" class="btn-primary">🎤 Áudio: ON</button>
      <button id="btnVideo" onclick="alternarVideo()" class="btn-primary">📹 Vídeo: ON</button>
      <button onclick="desligarChamada()" class="btn-danger">📴 Desligar</button>
    </div>

    <div class="chat-area" id="mensagensChat"></div>
    <div class="chat-input-area">
      <input type="text" id="textoMensagem" placeholder="Digite sua mensagem..." onkeypress="if(event.key === 'Enter') enviarMensagem()">
      <button onclick="enviarMensagem()" class="btn-primary">Enviar</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://xxmsrrekhtuvtpulkfwu.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh4bXNycmVraHR1dnRwdWxrZnd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5MTc2NTQsImV4cCI6MjA5NTQ5MzY1NH0.H7-Kn0FZ_W2gOrqsuClXV1-BkQywj8rXBavSg9I7R4Q";

    let localStream;
    let conexaoP2P;
    let canalDados;
    let codigoSala = "";
    let souCriador = false;
    let supabase;
    let canalTempoReal;

    const configuracao = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' }
      ]
    };

    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const statusTexto = document.getElementById('statusConexao');
    const logTela = document.getElementById('logTela');

    function adicionarLog(texto) {
      logTela.innerHTML += '> ' + texto + '<br>';
      logTela.scrollTop = logTela.scrollHeight;
    }

    window.onload = () => {
      adicionarLog("Sistema iniciado");
      
      supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      adicionarLog("✅ Conectado ao Supabase");

      const parametroUrl = new URLSearchParams(window.location.search);
      if (parametroUrl.get('sala')) {
        codigoSala = parametroUrl.get('sala');
        document.getElementById('roomCode').value = codigoSala;
        adicionarLog("Entrando automaticamente: " + codigoSala);
        entrarSala();
      }

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js');
      }
    };

    async function iniciarMidia() {
      try {
        adicionarLog("Ligando câmera e microfone...");
        localStream = await navigator.mediaDevices.getUserMedia({ 
          video: true, 
          audio: true 
        });
        localVideo.srcObject = localStream;
        adicionarLog("✅ Câmera e microfone OK");
      } catch (erro) {
        adicionarLog("❌ Erro ao acessar mídia: " + erro.message);
        alert("Não foi possível acessar câmera/microfone. Verifique as permissões.");
      }
    }

    function criarSala() {
      codigoSala = "sala-" + Math.random().toString(36).substr(2, 9);
      document.getElementById('roomCode').value = codigoSala;
      souCriador = true;
      const linkCompleto = `${window.location.origin}${window.location.pathname}?sala=${codigoSala}`;
      document.getElementById('linkTexto').innerText = linkCompleto;
      document.getElementById('linkCompartilhar').style.display = "block";
      
      iniciarMidia().then(() => {
        iniciarCanalTempoReal();
      });
    }

    function entrarSala() {
      codigoSala = document.getElementById('roomCode').value.trim();
      if (!codigoSala) return alert("Digite um código de sala válido!");
      
      souCriador = false;
      iniciarMidia().then(() => {
        iniciarCanalTempoReal();
      });
    }

    function iniciarCanalTempoReal() {
      if (!codigoSala) return;
      
      statusTexto.innerText = "🔄 Conectando...";
      statusTexto.className = "status conectando";

      adicionarLog(`Entrando na sala: ${codigoSala} | Sou criador: ${souCriador}`);

      canalTempoReal = supabase.channel(`sala:${codigoSala}`)
        .on('broadcast', { event: 'dados' }, async (payload) => {
          const dados = payload.payload;
          adicionarLog(`📩 Recebido: ${dados.tipo || 'candidato'}`);

          if (!conexaoP2P) {
            criarConexaoP2P();
          }

          try {
            if (dados.tipo === 'pronto') {
              if (souCriador && conexaoP2P.connectionState === 'new') {
                setTimeout(criarConvite, 500); // delay para estabilizar
              }
            }
            else if (dados.tipo === 'oferta') {
              await conexaoP2P.setRemoteDescription(new RTCSessionDescription(dados));
              const resposta = await conexaoP2P.createAnswer();
              await conexaoP2P.setLocalDescription(resposta);
              enviarDados({ ...resposta, tipo: 'resposta' });
            } 
            else if (dados.tipo === 'resposta') {
              await conexaoP2P.setRemoteDescription(new RTCSessionDescription(dados));
            } 
            else if (dados.candidate) {
              await conexaoP2P.addIceCandidate(new RTCIceCandidate(dados));
            }
          } catch (e) {
            adicionarLog("⚠️ Erro no processamento: " + e.message);
          }
        })
        .subscribe((status) => {
          if (status === 'SUBSCRIBED') {
            adicionarLog("✅ Inscrito na sala com sucesso");
            enviarDados({ tipo: 'pronto' });
          } else {
            adicionarLog("❌ Erro na inscrição: " + status);
          }
        });
    }

    function enviarDados(dados) {
      if (supabase && canalTempoReal) {
        supabase.channel(`sala:${codigoSala}`).send({
          type: 'broadcast',
          event: 'dados',
          payload: dados
        });
      }
    }

    function criarConexaoP2P() {
      if (conexaoP2P) return;
      
      adicionarLog("🔗 Criando conexão WebRTC...");
      conexaoP2P = new RTCPeerConnection(configuracao);

      localStream.getTracks().forEach(track => {
        conexaoP2P.addTrack(track, localStream);
      });

      conexaoP2P.ontrack = (evento) => {
        adicionarLog("✅ Vídeo do parceiro recebido!");
        remoteVideo.srcObject = evento.streams[0];
        statusTexto.innerText = "✅ CONECTADO DIRETO (P2P)";
        statusTexto.className = "status conectado";
      };

      conexaoP2P.onicecandidate = (evento) => {
        if (evento.candidate) enviarDados(evento.candidate);
      };

      conexaoP2P.onconnectionstatechange = () => {
        adicionarLog("Estado da conexão: " + conexaoP2P.connectionState);
      };

      // Canal de dados (chat)
      if (souCriador) {
        canalDados = conexaoP2P.createDataChannel("chat");
        configurarCanalTexto();
      } else {
        conexaoP2P.ondatachannel = (evento) => {
          canalDados = evento.channel;
          configurarCanalTexto();
        };
      }
    }

    async function criarConvite() {
      if (!conexaoP2P) return;
      try {
        adicionarLog("📤 Enviando oferta SDP...");
        const oferta = await conexaoP2P.createOffer();
        await conexaoP2P.setLocalDescription(oferta);
        enviarDados({ ...oferta, tipo: 'oferta' });
      } catch (e) {
        adicionarLog("❌ Erro ao criar oferta: " + e.message);
      }
    }

    function configurarCanalTexto() {
      canalDados.onopen = () => adicionarLog("📨 Canal de chat aberto!");
      canalDados.onmessage = (evento) => {
        adicionarMensagemTela('them', evento.data);
      };
    }

    function enviarMensagem() {
      if (!canalDados || canalDados.readyState !== "open") {
        return alert("Chat ainda não está conectado!");
      }
      const input = document.getElementById('textoMensagem');
      const texto = input.value.trim();
      if (!texto) return;
      
      canalDados.send(texto);
      adicionarMensagemTela('me', texto);
      input.value = "";
    }

    function adicionarMensagemTela(tipo, texto) {
      const caixa = document.getElementById('mensagensChat');
      const div = document.createElement('div');
      div.className = `message ${tipo}`;
      div.innerHTML = `<strong>${tipo === 'me' ? 'Você' : 'Parceiro'}:</strong> ${texto}`;
      caixa.appendChild(div);
      caixa.scrollTop = caixa.scrollHeight;
    }

    // Controles
    function alternarAudio() {
      if (!localStream) return;
      const track = localStream.getAudioTracks()[0];
      if (track) {
        track.enabled = !track.enabled;
        const btn = document.getElementById('btnAudio');
        btn.innerText = track.enabled ? "🎤 Áudio: ON" : "🎤 Áudio: OFF";
        btn.style.background = track.enabled ? "#00bfff" : "#ff8800";
      }
    }

    function alternarVideo() {
      if (!localStream) return;
      const track = localStream.getVideoTracks()[0];
      if (track) {
        track.enabled = !track.enabled;
        const btn = document.getElementById('btnVideo');
        btn.innerText = track.enabled ? "📹 Vídeo: ON" : "📹 Vídeo: OFF";
        btn.style.background = track.enabled ? "#00bfff" : "#ff8800";
      }
    }

    function desligarChamada() {
      if (conexaoP2P) conexaoP2P.close();
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      if (canalTempoReal) supabase.removeChannel(canalTempoReal);
      
      conexaoP2P = null;
      canalDados = null;
      remoteVideo.srcObject = null;
      statusTexto.innerText = "📴 Chamada encerrada";
      statusTexto.className = "status desconectado";
      adicionarLog("Chamada finalizada");
    }
  </script>
</body>
</html>
