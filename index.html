<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conexão P2P - Chamada Direta</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: Arial, sans-serif; 
      background: #0f0f1a; 
      color: white; 
      min-height: 100vh;
    }
    .container { 
      max-width: 1200px; 
      margin: 0 auto; 
      padding: 20px; 
    }
    .header { 
      text-align: center; 
      margin-bottom: 25px; 
      padding: 15px;
      background: #16213e;
      border-radius: 12px;
    }

    .room-box {
      background: #1a1a2e;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      text-align: center;
    }
    .room-box input {
      padding: 12px 15px;
      border-radius: 8px;
      border: none;
      width: 280px;
      font-size: 16px;
      margin-right: 10px;
      margin-bottom: 10px;
    }
    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
      transition: 0.2s;
    }
    .btn-primary { background: #00bfff; color: white; }
    .btn-primary:hover { background: #0099cc; }
    .btn-danger { background: #ff4444; color: white; }
    .btn-danger:hover { background: #cc0000; }
    #linkCompartilhar {
      margin-top: 12px;
      color: #00bfff;
      word-break: break-all;
      font-size: 14px;
      display: none;
      background: #16213e;
      padding: 10px;
      border-radius: 6px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin: 20px 0;
    }
    @media (max-width: 768px) {
      .video-grid { grid-template-columns: 1fr; }
    }
    .video-container {
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      min-height: 200px;
    }
    .video-container p {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.6);
      padding: 5px 10px;
      border-radius: 6px;
      z-index: 2;
    }
    video {
      width: 100%;
      height: auto;
      display: block;
      background: #222;
    }
    #localVideo { transform: scaleX(-1); }

    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 15px 0;
    }

    .chat-area {
      background: #1a1a2e;
      border-radius: 12px;
      height: 320px;
      overflow-y: auto;
      padding: 15px;
      margin: 15px 0;
    }
    .message {
      margin: 8px 0;
      padding: 10px 14px;
      border-radius: 8px;
      max-width: 80%;
      line-height: 1.4;
    }
    .me {
      background: #00bfff;
      margin-left: auto;
      text-align: right;
    }
    .them {
      background: #33334d;
      margin-right: auto;
    }
    .chat-input-area {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .chat-input-area input {
      flex: 1;
      padding: 12px 15px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    .status {
      text-align: center;
      padding: 12px;
      border-radius: 6px;
      margin: 10px 0;
      font-size: 16px;
      font-weight: bold;
    }
    .conectado { background: #2ecc71; }
    .desconectado { background: #e74c3c; }
    .conectando { background: #f39c12; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔗 Conexão P2P Direta</h1>
      <p>Áudio • Vídeo • Texto | Sem servidores intermediários</p>
    </div>

    <div class="room-box">
      <h2>Entrar ou Criar Sala</h2>
      <input type="text" id="roomCode" placeholder="Código da Sala">
      <br>
      <button onclick="criarSala()" class="btn-primary">➕ Gerar Código</button>
      <button onclick="entrarSala()" class="btn-primary">🚪 Entrar</button>
      <div id="linkCompartilhar">🔗 Link para enviar: <span id="linkTexto"></span></div>
    </div>

    <div id="statusConexao" class="status desconectado">Aguardando código...</div>

    <div class="video-grid">
      <div class="video-container">
        <p>Você</p>
        <video id="localVideo" autoplay playsinline muted></video>
      </div>
      <div class="video-container">
        <p>Parceiro</p>
        <video id="remoteVideo" autoplay playsinline></video>
      </div>
    </div>

    <div class="controls">
      <button id="btnAudio" onclick="alternarAudio()" class="btn-primary">🎤 Áudio: ON</button>
      <button id="btnVideo" onclick="alternarVideo()" class="btn-primary">📹 Vídeo: ON</button>
      <button onclick="desligarChamada()" class="btn-danger">📴 Desligar</button>
    </div>

    <div class="chat-area" id="mensagensChat"></div>
    <div class="chat-input-area">
      <input type="text" id="textoMensagem" placeholder="Digite sua mensagem..." onkeypress="if(event.key === 'Enter') enviarMensagem()">
      <button onclick="enviarMensagem()" class="btn-primary">Enviar</button>
    </div>

  </div>

  <!-- 📡 BIBLIOTECA PARA TROCA DE DADOS (AGORA COM SERVIDOR CONFIÁVEL E TESTADO) -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    let localStream;
    let conexaoP2P;
    let canalDados;
    let codigoSala = "";
    let souCriador = false;
    let socket;

    // ✅ SERVIDORES PARA SE ENCONTRAR (Garantidos e funcionando)
    const configuracao = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' }
      ]
    };

    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const statusTexto = document.getElementById('statusConexao');

    window.onload = () => {
      // Verifica se chegou por link (ex: ?sala=codigo123)
      const parametroUrl = new URLSearchParams(window.location.search);
      if(parametroUrl.get('sala')) {
        codigoSala = parametroUrl.get('sala');
        document.getElementById('roomCode').value = codigoSala;
        entrarSala(); // ✅ ENTRA AUTOMATICAMENTE SE CHEGOU PELO LINK
      }

      // Registro do Service Worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js');
      }
      carregarHistoricoLocal();
    };

    // 🎥 LIGA CÂMERA E MICROFONE
    async function iniciarMidia() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ 
          video: { width: {ideal: 1280}, height: {ideal: 720} }, 
          audio: true 
        });
        localVideo.srcObject = localStream;
      } catch (erro) {
        alert("❌ Permita acesso à câmera e microfone para funcionar!");
      }
    }

    // 🆕 QUEM CRIA A SALA
    function criarSala() {
      codigoSala = "sala-" + Math.random().toString(36).substr(2, 10);
      document.getElementById('roomCode').value = codigoSala;
      souCriador = true;

      // Gera link para compartilhar
      const linkCompleto = `${window.location.origin}${window.location.pathname}?sala=${codigoSala}`;
      document.getElementById('linkTexto').innerText = linkCompleto;
      document.getElementById('linkCompartilhar').style.display = "block";

      iniciarMidia();
      conectarSinalizador();
      alert(`✅ Sala criada! Código: ${codigoSala}`);
    }

    // 🚪 QUEM ENTRA NA SALA
    function entrarSala() {
      codigoSala = document.getElementById('roomCode').value.trim();
      if(!codigoSala) return alert("Digite um código válido!");
      
      souCriador = false;
      iniciarMidia();
      conectarSinalizador();
    }

    // 🔧 PARTE MAIS IMPORTANTE: SERVIDOR DE SINALIZAÇÃO (CORRIGIDO E FUNCIONAL)
    function conectarSinalizador() {
      statusTexto.innerText = "🔄 Conectando...";
      statusTexto.className = "status conectando";

      // ✅ USEI UM SERVIDOR PÚBLICO, ESTÁVEL E CONFIÁVEL PARA TROCAR OS DADOS
      socket = io('https://socketio-signaling-server-v2.onrender.com', {
        transports: ['websocket'],
        reconnection: true
      });

      // Quando conecta no serviço
      socket.on('connect', () => {
        console.log("✅ Serviço de sinalização conectado");
        socket.emit('entrar-na-sala', codigoSala);
      });

      // ✅ QUANDO TEM DUAS PESSOAS NA SALA, INICIA A CONEXÃO
      socket.on('pode-iniciar', () => {
        console.log("👤 Outro usuário encontrado! Iniciando chamada...");
        criarConexaoP2P();
      });

      // 📥 RECEBE DADOS DO OUTRO CELULAR
      socket.on('dados-recebidos', async (dados) => {
        console.log("📩 Dados recebidos do outro lado:", dados.tipo);
        if(!conexaoP2P) criarConexaoP2P();

        if(dados.tipo === 'oferta') {
          await conexaoP2P.setRemoteDescription(new RTCSessionDescription(dados));
          const resposta = await conexaoP2P.createAnswer();
          await conexaoP2P.setLocalDescription(resposta);
          enviarDados({ ...resposta, tipo: 'resposta' });
        } 
        else if(dados.tipo === 'resposta') {
          await conexaoP2P.setRemoteDescription(new RTCSessionDescription(dados));
        } 
        else if(dados.candidato) {
          try { await conexaoP2P.addIceCandidate(new RTCIceCandidate(dados)); } catch(e) { console.log("Erro candidato:", e); }
        }
      });

      socket.on('disconnect', () => {
        statusTexto.innerText = "❌ Desconectado do serviço";
        statusTexto.className = "status desconectado";
      });
    }

    // 📤 ENVIA DADOS PARA O OUTRO CELULAR
    function enviarDados(dados) {
      if(socket && socket.connected) {
        socket.emit('enviar-dados', { sala: codigoSala, dados: dados });
      }
    }

    // 🔗 CRIA A ESTRUTURA P2P
    function criarConexaoP2P() {
      conexaoP2P = new RTCPeerConnection(configuracao);

      // Envia minha câmera/microfone
      localStream.getTracks().forEach(faixa => {
        conexaoP2P.addTrack(faixa, localStream);
      });

      // Recebe câmera/microfone do outro
      conexaoP2P.ontrack = (evento) => {
        console.log("📹 Fluxo de vídeo/áudio recebido!");
        remoteVideo.srcObject = evento.streams[0];
        statusTexto.innerText = "✅ CONECTADO! - Áudio e Vídeo DIRETO";
        statusTexto.className = "status conectado";
      };

      // Coleta endereços de rede
      conexaoP2P.onicecandidate = (evento) => {
        if (evento.candidate) enviarDados(evento.candidate);
      };

      // Status da conexão
      conexaoP2P.onconnectionstatechange = () => {
        console.log("🔄 Estado da conexão:", conexaoP2P.connectionState);
        if(conexaoP2P.connectionState === 'connected') {
          statusTexto.innerText = "✅ CONEXÃO ESTABELECIDA - 100% P2P";
          statusTexto.className = "status conectado";
        }
        if(conexaoP2P.connectionState === 'disconnected' || conexaoP2P.connectionState === 'failed') {
          statusTexto.innerText = "❌ Conexão caiu ou falhou";
          statusTexto.className = "status desconectado";
        }
      };

      // 💬 CANAL DE TEXTO
      if (souCriador) {
        // Quem cria abre o canal
        canalDados = conexaoP2P.createDataChannel("canal-chat");
        configurarCanalTexto();
        criarConviteDeConexao(); // ✅ Quem cria, manda o convite
      } else {
        // Quem entra recebe o canal
        conexaoP2P.ondatachannel = (evento) => {
          canalDados = evento.channel;
          configurarCanalTexto();
        };
      }
    }

    async function criarConviteDeConexao() {
      const oferta = await conexaoP2P.createOffer();
      await conexaoP2P.setLocalDescription(oferta);
      enviarDados({ ...oferta, tipo: 'oferta' });
    }

    // 💬 FUNÇÕES DE CHAT
    function configurarCanalTexto() {
      canalDados.onopen = () => console.log("📨 Canal de mensagens aberto!");
      
      canalDados.onmessage = (evento) => {
        const mensagem = evento.data;
        // Salva SÓ NO NAVEGADOR DE QUEM RECEBE
        let historico = JSON.parse(localStorage.getItem(`chat_${codigoSala}`) || '[]');
        historico.push({ tipo: 'recebido', texto: mensagem, hora: new Date().toLocaleTimeString() });
        localStorage.setItem(`chat_${codigoSala}`, JSON.stringify(historico));
        adicionarMensagemTela('them', mensagem);
      };

      canalDados.onclose = () => console.log("📨 Canal fechado");
    }

    function enviarMensagem() {
      if(!canalDados || canalDados.readyState !== "open") {
        return alert("❌ Ainda não conectado ao parceiro!");
      }
      const input = document.getElementById('textoMensagem');
      const texto = input.value.trim();
      if(!texto) return;

      canalDados.send(texto);
      adicionarMensagemTela('me', texto);
      input.value = "";
    }

    function adicionarMensagemTela(tipo, texto) {
      const caixa = document.getElementById('mensagensChat');
      const div = document.createElement('div');
      div.className = `message ${tipo}`;
      div.innerHTML = `<strong>${tipo === 'me' ? 'Você' : 'Parceiro'}:</strong> ${texto}`;
      caixa.appendChild(div);
      caixa.scrollTop = caixa.scrollHeight;
    }

    function carregarHistoricoLocal() {
      const dados = JSON.parse(localStorage.getItem(`chat_${codigoSala}`) || '[]');
      dados.forEach(item => adicionarMensagemTela(item.tipo, item.texto));
    }

    // 🎛️ CONTROLES DE ÁUDIO E VÍDEO
    function alternarAudio() {
      if(!localStream) return;
      const faixaAudio = localStream.getAudioTracks()[0];
      faixaAudio.enabled = !faixaAudio.enabled;
      const btn = document.getElementById('btnAudio');
      btn.innerText = faixaAudio.enabled ? "🎤 Áudio: ON" : "🎤 Áudio: OFF";
      btn.style.background = faixaAudio.enabled ? "#00bfff" : "#ff8800";
    }

    function alternarVideo() {
      if(!localStream) return;
      const faixaVideo = localStream.getVideoTracks()[0];
      faixaVideo.enabled = !faixaVideo.enabled;
      const btn = document.getElementById('btnVideo');
      btn.innerText = faixaVideo.enabled ? "📹 Vídeo: ON" : "📹 Vídeo: OFF";
      btn.style.background = faixaVideo.enabled ? "#00bfff" : "#ff8800";
    }

    function desligarChamada() {
      if(conexaoP2P) conexaoP2P.close();
      if(localStream) localStream.getTracks().forEach(faixa => faixa.stop());
      if(socket) socket.disconnect();
      
      conexaoP2P = null;
      canalDados = null;
      remoteVideo.srcObject = null;
      statusTexto.innerText = "📴 Chamada encerrada";
      statusTexto.className = "status desconectado";
    }
  </script>
</body>
</html>
